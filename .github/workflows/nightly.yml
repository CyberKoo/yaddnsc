name: Nightly — full build matrix

on:
  schedule:
    # Daily at 21:38 UTC — only runs if there were commits in 24h.
    - cron: "38 21 * * *"
  workflow_dispatch:
    # Manual trigger — runs unconditionally on the selected branch.

permissions:
  contents: read

# Scheduled runs always execute from the default branch's workflow file, but
# the code under test is dev (active development branch): NIGHTLY_REF pins
# every checkout below. Manual runs build whichever branch was selected.
env:
  NIGHTLY_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate: check if full builds are needed ─────────────────────────
  should_run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
          fetch-depth: 0
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "result=true" >> "$GITHUB_OUTPUT"
              echo "Manual trigger — running all builds"
          else
              SINCE="$(date -d '24 hours ago' --iso-8601=seconds)"
              COUNT=$(git log --since="$SINCE" --oneline 2>/dev/null | wc -l)
              if [ "$COUNT" -gt 0 ]; then
                  echo "result=true" >> "$GITHUB_OUTPUT"
                  echo "Found $COUNT new commit(s) since $SINCE — running all builds"
              else
                  echo "result=false" >> "$GITHUB_OUTPUT"
                  echo "No new commits since $SINCE — skipping"
              fi
          fi

  # ── Build matrix ──────────────────────────────────────────────────
  linux-arm64:
    needs: [should_run]
    if: needs.should_run.outputs.result == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y ninja-build libssl-dev zlib1g-dev pkg-config
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  linux-amd64-feature-flags:
    needs: [should_run]
    if: needs.should_run.outputs.result == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: release
            cmake_flags: ""
            apt_deps: ""
          - name: system-spdlog
            cmake_flags: "-DYADDNSC_USE_SYSTEM_SPDLOG=ON"
            apt_deps: "libspdlog-dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build libssl-dev zlib1g-dev pkg-config ${{ matrix.config.apt_deps }}
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYADDNSC_BUILD_TESTS=OFF -DCPM_SOURCE_CACHE=$HOME/.cache/CPM ${{ matrix.config.cmake_flags }}
      - name: Build
        run: ninja -C build -j$(nproc)

  native-packages:
    needs: [should_run]
    if: needs.should_run.outputs.result == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian-13
            target: debian:13
            builder: deb
          - id: ubuntu-24.04
            target: ubuntu:24.04
            builder: deb
          - id: ubuntu-26.04
            target: ubuntu:26.04
            builder: deb
          - id: fedora-43
            target: fedora:43
            builder: rpm
          - id: opensuse-leap-16.0
            target: opensuse/leap:16.0
            builder: rpm
          - id: opensuse-tumbleweed
            target: opensuse/tumbleweed:latest
            builder: rpm
          - id: alpine-3
            target: alpine:3
            builder: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Build native packages
        run: |
          docker build --target export-untested \
            --file "docker/Dockerfile.${{ matrix.builder }}" \
            --build-arg "BASE_IMAGE=${{ matrix.target }}" \
            --build-arg BUILD_JOBS=2 \
            --output "nightly-out/${{ matrix.id }}" \
            .
      - name: Prepare release assets
        run: |
          mkdir -p release
          for package in "nightly-out/${{ matrix.id }}"/*.${{ matrix.builder }}; do
            mv "${package}" "release/${{ matrix.id }}-${package##*/}"
          done
      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.id }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  native-packages-arm64:
    needs: [should_run]
    if: needs.should_run.outputs.result == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian-13-arm64
            target: debian:13
            builder: deb
          - id: fedora-43-arm64
            target: fedora:43
            builder: rpm
          - id: alpine-3-arm64
            target: alpine:3
            builder: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Build native packages
        run: |
          docker build --target export-untested \
            --file "docker/Dockerfile.${{ matrix.builder }}" \
            --build-arg "BASE_IMAGE=${{ matrix.target }}" \
            --build-arg BUILD_JOBS=2 \
            --output "nightly-out/${{ matrix.id }}" \
            .
      - name: Prepare release assets
        run: |
          mkdir -p release
          for package in "nightly-out/${{ matrix.id }}"/*.${{ matrix.builder }}; do
            mv "${package}" "release/${{ matrix.id }}-${package##*/}"
          done
      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.id }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  nightly-release:
    needs: [native-packages, native-packages-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Download native packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release-artifacts
          merge-multiple: true
      - name: Update nightly pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NIGHTLY_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          NOTES="$(printf 'This release contains the latest automated Nightly build of yaddnsc.\n\n- **Commit**: `%s`\n- **Branch**: `%s`\n- **Build Time**: %s\n\nThese packages are automatically compiled and updated on every nightly build / manual run.\nIncludes x86_64 and AArch64 packages. This is a development pre-release, not a stable release.' "${SHORT_SHA}" "${NIGHTLY_REF}" "${BUILD_TIME}")"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --target "${NIGHTLY_SHA}" \
              --title "Nightly" \
              --prerelease \
              --notes "${NOTES}"
          else
            gh release create nightly \
              --target "${NIGHTLY_SHA}" \
              --title "Nightly" \
              --prerelease \
              --notes "${NOTES}"
          fi
          gh release upload nightly release-artifacts/* --clobber

  linux-amd64-sanitizer:
    needs: [should_run]
    if: needs.should_run.outputs.result == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
      ASAN_OPTIONS: detect_stack_use_after_return=1:strict_string_checks=1:detect_invalid_pointer_pairs=2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y ninja-build libssl-dev zlib1g-dev pkg-config
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Sanitizer -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  # ----------------------------------------------------------------------
  # Static analysis, compile-only (no ctest). Ubuntu 26.04 ships clang-21
  # with matching clang-tidy and IWYU from the same distro release.
  # Enforcement boundaries: compiler warnings fail via yaddnsc_warnings -Werror;
  # IWYU findings are reported without --error (cmake/IWYU.cmake) and do not
  # fail the build; clang-tidy fails it only for the defect-prone families
  # (WarningsAsErrors: 'bugprone-*,clang-analyzer-*,cert-*') and runs with
  # --extra-arg=-Wno-error so the project's -Werror does not fail its own run.
  # Tidy parse errors fail too.
  # ----------------------------------------------------------------------
  linux-amd64-lint:
    needs: [should_run]
    if: needs.should_run.outputs.result == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y clang clang-tidy iwyu lld libc++-dev libc++abi-dev ninja-build libssl-dev zlib1g-dev pkg-config
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_BUILD_TESTS=ON
          -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
          -DCMAKE_CXX_FLAGS="-stdlib=libc++"
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fuse-ld=lld"
          -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -fuse-ld=lld"
          -DCMAKE_MODULE_LINKER_FLAGS="-stdlib=libc++ -fuse-ld=lld"
      - name: Build (compile-only lint)
        # -k 0 keeps going past a failed target instead of stopping at the
        # first one. The lint findings are the point of this job, and stopping
        # at the first failure reported one of them while hiding the rest.
        run: ninja -C build -j$(nproc) -k 0
