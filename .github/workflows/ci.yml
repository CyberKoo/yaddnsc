name: CI tests

on:
  push:
    branches: [master, dev, v0.x, "v*.x"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/**"
  pull_request:
    branches: [master, dev, v0.x, "v*.x"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake git ninja-build gcc-14 g++-14 libssl-dev zlib1g-dev pkg-config python3-venv curl
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  linux-amd64-musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: alpine:3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: apk add --no-cache build-base git cmake samurai openssl openssl-dev zlib-dev pkgconfig python3
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: brew install cmake ninja openssl@3 pkg-config
      - name: Configure
        run: cmake -B build -G Ninja -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3/ -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build
        run: ninja -C build -j$(getconf _NPROCESSORS_ONLN)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(getconf _NPROCESSORS_ONLN)

  # ----------------------------------------------------------------------
  # ThreadSanitizer — data-race detection on the full test suite.
  # Ubuntu-only: GCC's libtsan does not support musl (linux-amd64-musl),
  # and C++23 coroutines under Darwin TSan are unverified. Runs on push
  # like the fast correctness jobs above; TSan reports make the test
  # binaries exit non-zero, so a green job means zero warnings.
  # ----------------------------------------------------------------------
  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake git ninja-build gcc-14 g++-14 libssl-dev zlib1g-dev pkg-config python3-venv curl
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=ThreadSanitizer -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=0 history_size=7 second_deadlock_stack=1 report_bugs=1
        # -E: test_stop_signals checks signal dispositions and exit codes
        # through a forked death-test child; an asynchronous SIGINT landing
        # inside TSan-intercepted code deadlocks libtsan on the CI runners
        # (the child hangs, the parent waits forever). The suite shares no
        # mutable state across threads — atomics and a pipe only — so TSan
        # has nothing to detect in it.
        # --timeout: turn any future per-test hang into a bounded failure
        # instead of a cancelled 30-minute job with no diagnostics.
        run: ctest --test-dir build --output-on-failure -j2 --timeout 300 -E '^test_stop_signals$'

  # ----------------------------------------------------------------------
  # Conversion warning gate.
  # -Wconversion -Wsign-conversion conflict heavily with the standard library
  # and common idioms, so they are NOT enabled on every local build. They run
  # here as a dedicated job to catch narrowing bugs before merge while keeping
  # developer velocity high. Restricted to pull_request so it does not build on
  # every push (the fast checks above already cover push correctness).
  # ----------------------------------------------------------------------
  conversion-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake git ninja-build gcc-14 g++-14 libssl-dev zlib1g-dev pkg-config
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_BUILD_TESTS=ON
          -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
          -DCMAKE_CXX_FLAGS="-Wconversion -Wsign-conversion"
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  # ----------------------------------------------------------------------
  # Benchmark job — run the performance benchmarks on PRs for quick feedback.
  # Smoke run only: there is no stored baseline, comparison step, or
  # performance-regression threshold.
  # ----------------------------------------------------------------------
  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake git ninja-build gcc-14 g++-14 libssl-dev zlib1g-dev pkg-config
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build benchmarks
        run: ninja -C build -j$(nproc) bench_dns_parser bench_uri bench_string_util bench_inet_address bench_socket_addr bench_builder
      - name: Run benchmarks
        run: |
          for b in bench_dns_parser bench_uri bench_string_util bench_inet_address bench_socket_addr bench_builder; do
              echo "=== $b ==="
              ./build/test/perf/$b --benchmark_format=console 2>&1 | tail -n +12
          done

  # ----------------------------------------------------------------------
  # Plugin contract — build the whiteboard test plugin and run the real
  # dlopen / Host Services contract tests: ABI rejection matrix, plugin
  # lifecycle, and the AbiDriverGateway (including same-module concurrency).
  # Plugins resolve no host symbols (no CORE_LOG backfill; the
  # architecture_guard test polices that boundary in the main jobs).
  # ----------------------------------------------------------------------
  plugin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify frozen ABI 1.0 baseline integrity
        # The frozen v1.0 header copy must never be edited; it is the
        # reference the ABI freeze promise is tested against.
        run: cd test/plugin/abi_baseline/v1_0 && sha256sum -c driver_abi.h.sha256
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake git ninja-build gcc-14 g++-14 libssl-dev zlib1g-dev pkg-config python3-venv
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_BUILD_TESTS=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Build plugin contract targets
        run: ninja -C build -j$(nproc) test_plugin_abi_contract test_plugin_lifecycle test_abi_freeze_compat test_coro_driver_gateway
      - name: Run plugin contract tests
        run: ctest --test-dir build --output-on-failure -R 'plugin_abi_contract|plugin_lifecycle|abi_freeze_compat|coro_driver_gateway'

  sdk-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake git ninja-build gcc-14 g++-14 libssl-dev libxml2-dev zlib1g-dev pkg-config
      - name: Configure SDK development package
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYADDNSC_ENABLE_DEB=ON -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
      - name: Package header-only SDK
        run: cpack --config build/CPackConfig.cmake -D 'CPACK_COMPONENTS_ALL=dev;glaze_Development' -B sdk-deb
      - name: Install and consume final DEB in a clean container
        run: |
          docker run --rm -v "$PWD/sdk-deb:/packages:ro" ubuntu:24.04 bash -euxc '
            apt-get update
            apt-get install -y cmake gcc-14 g++-14 ninja-build /packages/yaddnsc-dev_*.deb
            ! dpkg-query -W yaddnsc
            CC=gcc-14 CXX=g++-14 cmake -DSDK_PREFIX=/usr -DWORK_DIR=/tmp/sdk-check -DVERIFY_OLD_CXX_ABI=ON -P /usr/share/yaddnsc/examples/verify.cmake
          '

  # Coverage runs on every code push/PR, independently of sanitizer builds.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake git ninja-build gcc-14 g++-14 libssl-dev zlib1g-dev pkg-config python3-venv lcov curl
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYADDNSC_SANITIZE_DEBUG=OFF
          -DYADDNSC_BUILD_TESTS=ON
          -DCPM_SOURCE_CACHE=$HOME/.cache/CPM
          -DCMAKE_CXX_FLAGS="--coverage -O0 -fprofile-update=atomic"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage -fprofile-update=atomic"
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Test
        id: coverage-tests
        run: ctest --test-dir build --output-on-failure -j$(nproc)
      - name: Generate coverage report
        id: coverage-report
        if: ${{ !cancelled() && (steps.coverage-tests.outcome == 'success' || steps.coverage-tests.outcome == 'failure') }}
        run: |
          python3 -m venv /tmp/cov-venv
          source /tmp/cov-venv/bin/activate
          # Pinned: an unpinned fastcov can change how per-TU records are merged
          # into one LCOV record per file, moving the numbers with no source change.
          pip install -q fastcov==1.17
          # Anchor includes to this checkout, not third-party CPM headers.
          # -b excludes compiler-generated exceptional branches; keep the same
          # branch convention as the coverage gate's existing baseline.
          fastcov -g gcov-14 -d build \
              -i "$(pwd)/src/" "$(pwd)/include/" "$(pwd)/driver/" \
              -e "/usr/" "*/generated/" \
              -b -o coverage.info --lcov
          # --ignore-errors inconsistent is required here, not cosmetic. GCC 14
          # reports branch records with a zero taken count on lines that did run
          # (coroutine lowering leaves such edges behind), lcov calls that
          # inconsistent, and without the override it refuses to print at all.
          # The side effect is that lcov's own totals in this step are NOT
          # trustworthy: on this codebase they degrade to ~66% line, >100%
          # function and 0% branch coverage while the records it reads are sound.
          # Read them as a debug aid only. test/coverage_gate.py below parses the
          # raw records and is the single authority — when the two disagree, the
          # gate is right and this listing is the thing that is broken.
          lcov --list coverage.info --ignore-errors inconsistent --rc lcov_branch_coverage=1
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage-report.outcome == 'success' }}
        run: python3 test/coverage_gate.py coverage.info
      # A failed test or gate must not hide the generated report from Codecov.
      # Disable discovery/plugins so only the product-code LCOV is uploaded.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && steps.coverage-report.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          disable_search: true
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
